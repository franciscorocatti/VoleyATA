<style>
:root{--bg:#f3f6f9;--card:#fff;--ink:#152033;--muted:#687789;--border:#dfe6ed;--primary:#0b766e;--primary-soft:#e1f7f2;--dark:#0d1726;--red:#bb3b47;--red-soft:#fff0f0;--gold:#c58a26;--shadow:0 8px 30px rgba(24,44,68,.055)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);font:15px/1.47 system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.38;cursor:not-allowed}input,select{width:100%;border:1px solid #ccd6e0;background:white;border-radius:9px;padding:10px 11px;min-height:42px;color:var(--ink)}input:focus,select:focus,button:focus-visible{outline:3px solid #8fe3d2;outline-offset:2px}h1,h2,h3,p{margin-top:0}h1{font-size:29px;line-height:1.17;letter-spacing:-.8px}h2{font-size:19px;letter-spacing:-.25px}h3{font-size:15px}p{color:var(--muted)}small,.hint{color:var(--muted)}.header{background:var(--dark);color:white}.header-inner{max-width:1300px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 22px}.brand{display:flex;gap:11px;align-items:center;white-space:nowrap;font-size:17px;font-weight:800;letter-spacing:-.4px}.brand-mark{background:#127e72;border-radius:11px;width:37px;height:37px;display:grid;place-items:center;font-size:22px}.header-side{font-size:12px;color:#9eb3ca}.app{max-width:1300px;margin:0 auto;padding:24px 22px 60px}.toolbar{display:flex;gap:9px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:19px}.tabs{display:flex;gap:5px;padding:4px;background:#e6ebf1;border-radius:12px;flex-wrap:wrap}.tab{background:transparent;border:0;border-radius:9px;color:#526275;font-weight:750;padding:10px 15px}.tab.active{background:white;color:var(--primary);box-shadow:0 1px 6px #9bacc14c}.btn{background:white;border:1px solid var(--border);border-radius:10px;padding:10px 14px;min-height:42px;font-weight:750;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn:hover:not(:disabled){filter:brightness(.97)}.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}.btn-danger{color:var(--red);border-color:#f5ccd1;background:#fff}.btn-dark{background:var(--dark);border-color:var(--dark);color:white}.btn-soft{background:var(--primary-soft);border-color:#b4e6db;color:#08695f}.btn-full{width:100%}.btn-small{min-height:35px;padding:6px 10px;font-size:12px}.row{display:flex;align-items:center;gap:11px;flex-wrap:wrap}.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.card{border:1px solid var(--border);box-shadow:var(--shadow);border-radius:15px;background:var(--card);padding:21px}.subtle{background:#f8fafc;border:1px solid #e8edf2;border-radius:11px;padding:13px}.muted{color:var(--muted)}.eyebrow{color:var(--primary);font-size:11px;font-weight:850;letter-spacing:1.4px;text-transform:uppercase}.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.live-grid{display:grid;grid-template-columns:minmax(0,1.03fr) minmax(0,.97fr);gap:16px}.stack{display:flex;flex-direction:column;gap:16px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;font-weight:750;color:#45566b}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap}.section-head h2,.section-head h3{margin:0}.scorecard{background:linear-gradient(125deg,#0d1726,#162b3f);color:white;border-radius:16px;padding:21px 24px;margin-bottom:17px;box-shadow:0 9px 30px #1b33452b}.score-top{display:flex;justify-content:space-between;gap:10px;align-items:center;color:#b6d2df;font-size:12px;letter-spacing:.4px}.score-main{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;text-align:center;padding:13px 0}.team{font-weight:750;white-space:normal;overflow-wrap:anywhere;font-size:16px;line-height:1.2}.score{font-size:clamp(44px,6vw,75px);font-weight:850;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-2px}.score-sep{color:#7d94ad;font-size:28px}.pill{background:#e0f8ef;color:#086a51;padding:5px 9px;border-radius:40px;font-size:11px;font-weight:850;display:inline-flex;gap:5px;align-items:center}.pill-dark{color:#caf8e7;background:#1e564d}.pill-red{background:#ffebec;color:#aa2937}.scores-sets{display:flex;gap:5px;justify-content:center;margin-top:10px}.setchip{padding:5px 10px;background:#30465d;border-radius:8px;color:#c5d4e0;font-size:11px}.setchip.current{background:#086d62;color:white}.player-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.player{border:1px solid var(--border);background:#f8fafb;border-radius:11px;min-height:65px;padding:8px;text-align:left;display:flex;align-items:center;gap:9px}.player:hover{border-color:#65c5b2}.player.selected{border:2px solid var(--primary);background:var(--primary-soft)}.jersey{flex:0 0 33px;height:34px;width:33px;border-radius:8px;background:#e4edf3;display:grid;place-items:center;font-weight:850;color:#1d3a49}.player.selected .jersey{background:var(--primary);color:white}.playername{display:block;font-size:12px;font-weight:750;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.playerpos{color:var(--muted);font-size:10px;display:block}.skill-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.skill{border:1px solid #d6e1e8;background:#f7fafc;color:#334657;border-radius:9px;padding:10px 6px;min-height:43px;font-size:12px;font-weight:800}.skill.selected{background:var(--dark);border-color:var(--dark);color:white}.outcome-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.outcome{border:1px solid var(--border);border-radius:10px;min-height:47px;background:#fff;font-weight:750}.outcome.good{color:#08745e;background:#eaf9f4;border-color:#b9e5d8}.outcome.bad{color:#ab3b46;background:#fff0f0;border-color:#facfd3}.outcome.neutral{background:#f3f6f9}.court{border:2px solid #caad79;background:#f4dfb5;border-radius:12px;padding:13px;position:relative;max-width:400px;margin:0 auto}.court::before{content:'RED';position:absolute;left:10px;right:10px;top:11px;border-top:3px dotted #8c6944}.court-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}.zone{background:#fff8e8b8;color:#755b38;border:1px solid #d6bb88;border-radius:7px;font-weight:850;min-height:43px}.zone.selected{background:#0c8070;border-color:#0c8070;color:white}.mini-court{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;max-width:450px;margin:auto}.mini-zone{border:1px solid #d8e0ea;border-radius:9px;padding:13px 6px;text-align:center;background:#f9fbfd}.mini-zone .big{font-weight:850;font-size:22px;display:block}.mini-zone .tiny{font-size:11px;color:#637387}.draft-list{display:flex;gap:7px;flex-wrap:wrap;min-height:37px}.draft-tag{border-radius:8px;border:1px solid #cfe0e5;padding:6px 9px;background:#f3faf8;font-size:11px;color:#1a6157}.rally-buttons{display:grid;grid-template-columns:1fr 1fr;gap:11px}.rally-btn{padding:15px 7px;border:none;color:#fff;border-radius:12px;font-size:16px;font-weight:850}.rally-btn.us{background:#097c69}.rally-btn.them{background:#bd4652}.stat-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:17px}.metric{background:white;border:1px solid var(--border);border-radius:13px;padding:17px}.metric .value{font-size:26px;font-weight:850;letter-spacing:-.5px}.metric .label{font-size:12px;color:var(--muted)}.tablewrap{overflow:auto;border:1px solid var(--border);border-radius:11px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:11px 10px;text-align:left;border-bottom:1px solid #ebeff3;white-space:nowrap}th{background:#f3f7fa;font-weight:850;color:#435468}tr:last-child td{border-bottom:0}tr:hover td{background:#f9fbfd}.hinttext{margin:10px 0 0;font-size:12px}.history{display:flex;flex-direction:column;gap:8px}.history-row{border:1px solid var(--border);border-radius:11px;padding:13px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.history-row.active{border-color:#84cdbb;background:#f0faf7}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{background:#e9eff4;padding:3px 7px;font-size:11px;color:#55687a;border-radius:6px}.roster-row{display:grid;grid-template-columns:75px 1fr 36px;gap:8px;align-items:center;margin:8px 0}.lineup-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.callout{padding:13px;border-radius:11px;background:#eff9f6;border:1px solid #c7e9df;font-size:13px;color:#1e685b}.errorbox{padding:13px;border-radius:11px;background:#fff1f1;border:1px solid #f4c7cd;color:#a43340;font-size:13px}.empty{padding:45px 18px;text-align:center;border:1px dashed #bdcbd8;border-radius:16px;background:#fff}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);border-radius:12px;background:#152c32;color:#fff;padding:12px 18px;max-width:min(92vw,500px);box-shadow:0 8px 28px #0003;z-index:20;font-weight:750;font-size:12px}.stats-actions{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:18px}.stats-actions select{max-width:190px}.footer{padding:24px 6px;color:#718091;text-align:center;font-size:12px}.hide{display:none!important}
@media(max-width:900px){.live-grid{grid-template-columns:1fr}.stat-metrics{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.header-inner{padding:13px 15px}.header-side{display:none}.app{padding:15px 11px 50px}.card{padding:15px}.toolbar{align-items:stretch}.tabs{width:100%;display:grid;grid-template-columns:repeat(4,1fr)}.tab{padding:9px 4px;font-size:11px}.toolbar>.btn{width:100%}.scorecard{padding:16px 12px}.score-main{gap:8px}.score{font-size:48px}.team{font-size:13px}.player-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-2{grid-template-columns:1fr}.stat-metrics{gap:8px}.metric{padding:13px}.metric .value{font-size:22px}.lineup-grid{grid-template-columns:repeat(2,1fr)}.score-top{font-size:11px}.btn-small{font-size:11px}.rally-btn{font-size:14px}}
@media print{body{background:white}.header,.toolbar,.no-print,.rally-buttons,.footer{display:none!important}.app{padding:0;max-width:100%}.card,.metric{box-shadow:none;break-inside:avoid}.live-grid{display:block}.print-only{display:block!important}}

<body>
<header class="header"><div class="header-inner"><div class="brand"><div class="brand-mark">🏐</div><div>Volley Scout <span style="color:#7de0c8;font-size:11px">ADVANCED</span></div></div><div class="header-side">Scouting en vivo · guardado local y conexión a Google Sheets</div></div></header>
<main class="app" id="app"></main>
<script src="sheets-sync.js"></script>
<script src="team-management.js"></script>
<script src="blocker-tracking.js"></script>
<script src="sequence-stats.js"></script>
<script src="formation-stats.js"></script>
<script>
'use strict';
const KEY='volley_scout_avanzado_v1';
const skills={
 serve:{name:'Saque',outcomes:['Ace','Positivo','Continuidad','Error'],hint:'Zona de destino del saque (campo rival).'},
 reception:{name:'Recepción',outcomes:['Perfecta','Positiva','Negativa','Error'],hint:'Zona donde se recibió el saque.'},
 attack:{name:'Ataque',outcomes:['Punto','Continuidad','Bloqueado','Error'],hint:'Zona de destino del ataque (campo rival).'},
 block:{name:'Bloqueo',outcomes:['Punto','Toque','Error'],hint:'Zona en la que se realizó el bloqueo.'},
 defense:{name:'Defensa',outcomes:['Perfecta','Positiva','Negativa','Error'],hint:'Zona donde se realizó la defensa.'},
 setting:{name:'Armado',outcomes:['Perfecta','Positiva','Negativa','Error'],hint:'Zona desde donde se armó.'}
};
let state=load();
let view='live',showSetup=false,selectedPlayerId=null,selectedSkill='attack',selectedZone=4,pending=[],statSet='all',zoneSkill='attack',notice='',noticeTimer;
let setupDraft=freshSetup();
function uid(){return (Date.now().toString(36)+Math.random().toString(36).slice(2,9));}
function localDate(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function freshSetup(){return {team:'Mi equipo',opponent:'Rival',date:localDate(),firstServe:'us',players:Array.from({length:8},(_,i)=>({number:String(i+1),name:'Jugador '+(i+1)}))}}
function load(){try{let obj=JSON.parse(localStorage.getItem(KEY));if(obj&&obj.version===1&&Array.isArray(obj.matches))return obj;}catch(e){}return {version:1,activeId:null,matches:[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));scheduleSheets()}catch(e){toast('No se pudo guardar: almacenamiento del navegador lleno o bloqueado. Exportá una copia JSON.')}}
function activeMatch(){return state.matches.find(x=>x.id===state.activeId)||null}
function activeSet(){const m=activeMatch();return m?.sets?.[m.sets.length-1]||null}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(n){return Number(n||0).toLocaleString('es-AR')}
function pct(a,b){return b?Math.round(100*a/b)+'%':'—'}
function ratio(a,b){return b?((100*a/b).toFixed(1).replace('.',','))+'%':'—'}
function toast(s){let e=document.getElementById('toast');if(!e){e=document.createElement('div');e.id='toast';e.className='toast';document.body.appendChild(e)}e.textContent=s;e.classList.remove('hide');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>e.classList.add('hide'),4000)}
function playerById(m,id){return m.players.find(p=>p.id===id)}
function pname(m,id){let p=playerById(m,id);return p?'#'+p.number+' '+p.name:'Jugador eliminado'}
function newSet(n,serve,positions){return {id:uid(),number:n,score:{us:0,them:0},serve,startServe:serve,rotation:1,positions:[...positions],initialLineup:[...positions],changes:[],libero:null,rallies:[],finished:false,winner:null}}
function getSetLimit(m,s){return m.bestOf===5&&s.number===5?15:25}
function matchWinner(m){let wins={us:0,them:0};m.sets.forEach(s=>{if(s.winner)wins[s.winner]++});return wins}
function matchEnded(m){const w=matchWinner(m);return w.us>=Math.ceil(m.bestOf/2)||w.them>=Math.ceil(m.bestOf/2)}
function rotatePositions(p){return [p[1],p[2],p[3],p[4],p[5],p[0]]}
function rowsFor(m,filter='all'){return m.sets.flatMap(s=>(filter==='all'||String(s.number)===String(filter)?s.rallies.map(r=>({...r,setNo:s.number})):[]))}
function actionsFor(m,filter='all'){return rowsFor(m,filter).flatMap(r=>r.actions.map(a=>({...a,setNo:r.setNo,rallyId:r.id,winner:r.winner}))) }
function scoreText(s){return s.score.us+' — '+s.score.them}
function configurePlayer(){let m=activeMatch(),s=activeSet();if(!m||!s)return; if(!courtPlayers(s).includes(selectedPlayerId))selectedPlayerId=courtPlayers(s)[0]||null}
function render(){let app=document.getElementById('app');const m=activeMatch();if(showSetup||!m){app.innerHTML=sheetsPanel()+renderSetup();return}configurePlayer();app.innerHTML=sheetsPanel()+`<div class="toolbar no-print"><div class="tabs">${[['live','En vivo'],['stats','Estadísticas'],['matches','Partidos'],['settings','Plantel']].map(([v,t])=>`<button class="tab ${view===v?'active':''}" data-action="view" data-view="${v}">${t}</button>`).join('')}</div><button class="btn btn-small" data-action="new-match">＋ Nuevo partido</button></div>${view==='live'?renderLive(m)+opponentFormationCard(m,true):view==='stats'?renderStats(m):view==='matches'?renderMatches(m):renderSettings(m)}<div class="footer no-print">Guardado automático en este navegador · Exportá un JSON para tener una copia de seguridad.</div>`}
function renderSetup(){return `<div style="max-width:970px;margin:auto"><div class="row-between" style="margin-bottom:16px"><div><div class="eyebrow">Paso 1 · Configuración</div><h1>Prepará el partido</h1><p style="margin-bottom:0">Podés editar el plantel ahora o más adelante. Se necesita un mínimo de 6 jugadores.</p></div>${state.matches.length?'<button class="btn" data-action="cancel-setup">Volver</button>':''}</div><div class="grid-2"><div class="card stack"><h2>Datos del partido</h2><div class="field"><label>Mi equipo</label><input data-setup="team" maxlength="70" value="${esc(setupDraft.team)}"></div><div class="field"><label>Rival</label><input data-setup="opponent" maxlength="70" value="${esc(setupDraft.opponent)}"></div><div class="field"><label>Fecha</label><input data-setup="date" type="date" value="${esc(setupDraft.date)}"></div><div class="field"><label>Primer saque del set 1</label><select data-setup="firstServe"><option value="us" ${setupDraft.firstServe==='us'?'selected':''}>Sacamos nosotros</option><option value="them" ${setupDraft.firstServe==='them'?'selected':''}>Recibimos nosotros</option></select></div><div class="callout">Se juega al mejor de 5 sets. Los primeros cuatro son a 25 puntos y el quinto a 15, siempre con diferencia de 2.</div>${opponentDraftCard()}</div><div class="card"><div class="section-head"><h2>Jugadores</h2><button class="btn btn-small btn-soft" data-action="setup-add">+ Agregar</button></div><div class="roster-header"><small>Número</small><small>Nombre</small></div><div style="max-height:430px;overflow:auto">${setupDraft.players.map((p,i)=>`<div class="roster-row"><input aria-label="Número del jugador ${i+1}" data-setup-roster="${i}" data-prop="number" maxlength="3" value="${esc(p.number)}"><input aria-label="Nombre del jugador ${i+1}" data-setup-roster="${i}" data-prop="name" maxlength="50" value="${esc(p.name)}"><button type="button" title="Quitar" class="btn btn-small btn-danger" data-action="setup-remove" data-index="${i}" ${setupDraft.players.length<=6?'disabled':''}>×</button></div>`).join('')}</div>${draftFormation()}<button class="btn btn-primary btn-full" style="margin-top:16px" data-action="create-match">Crear partido y comenzar →</button></div></div></div>`}
function renderLive(m){let s=activeSet(),wins=matchWinner(m),end=matchEnded(m);let finishedMessage=s.finished?`<div class="callout"><strong>Set ${s.number} finalizado: ${esc(s.winner==='us'?m.team:m.opponent)}.</strong> ${end?'Partido terminado.':'Iniciá el próximo set para continuar.'}</div>`:'';return `<div class="scorecard"><div class="score-top"><span>${esc(m.date)} · SET ${s.number} ${s.finished?'· FINALIZADO':'· EN JUEGO'}</span><span>${s.finished?'Sin saque':s.serve==='us'?'● Sacamos nosotros':'● Saca el rival'}</span></div><div class="score-main"><div><div class="team">${esc(m.team)}</div><div class="score">${s.score.us}</div><span class="pill pill-dark">${wins.us} ${wins.us===1?'set':'sets'}</span></div><div class="score-sep">:</div><div><div class="team">${esc(m.opponent)}</div><div class="score">${s.score.them}</div><span class="pill pill-dark">${wins.them} ${wins.them===1?'set':'sets'}</span></div></div><div class="row-between"><div class="row"><span class="setchip current">Rotación R${s.rotation}</span><span class="setchip">Puntos jugados: ${s.rallies.length}</span></div><span class="setchip">${s.finished?'Set cerrado':'Set a '+getSetLimit(m,s)}</span></div><div class="scores-sets">${m.sets.map(x=>`<span class="setchip ${x.id===s.id?'current':''}">S${x.number}: ${x.score.us}-${x.score.them}</span>`).join('')}</div></div>${finishedMessage?`<div style="margin-bottom:15px">${finishedMessage}<div class="row" style="margin-top:9px">${!end?'<button class="btn btn-primary" data-action="next-set">Iniciar siguiente set →</button>':''}<button class="btn" data-action="undo-rally">↩ Corregir último punto</button></div></div>`:''}
<div class="live-grid"><div class="stack"><div class="card"><div class="section-head"><h2>1 · Elegí el jugador</h2><span class="pill">R${s.rotation} · en cancha</span></div><div class="player-grid">${courtPlayers(s).map((id,i)=>{let p=playerById(m,id);return `<button class="player ${selectedPlayerId===id?'selected':''}" data-action="select-player" data-player="${esc(id)}"><span class="jersey">${esc(p?.number||'?')}</span><span style="min-width:0"><span class="playername">${esc(p?.name||'Sin jugador')}</span><span class="playerpos">Posición ${i+1}${p?.isLibero?' · LÍBERO':''}</span></span></button>`}).join('')}</div><p class="hinttext"><button class="btn btn-small btn-soft" data-action="view" data-view="settings">Formación, cambios y líberos</button></p></div><div class="card"><div class="section-head"><h2>2 · Fundamento</h2><small>${esc(pname(m,selectedPlayerId))}</small></div><div class="skill-grid">${Object.entries(skills).map(([key,v])=>`<button class="skill ${selectedSkill===key?'selected':''}" data-action="select-skill" data-skill="${key}">${v.name}</button>`).join('')}</div><div class="section-head" style="margin-top:18px"><h3>Zona ${selectedZone}</h3><small>${selectedSkill==='serve'||selectedSkill==='attack'?'Campo rival':'Campo propio'}</small></div><div class="court"><div class="court-grid">${[4,3,2,5,6,1].map(z=>`<button class="zone ${selectedZone===z?'selected':''}" data-action="select-zone" data-zone="${z}">Zona ${z}</button>`).join('')}</div></div><p class="hinttext">${esc(skills[selectedSkill].hint)}</p></div></div><div class="stack"><div class="card"><h2>3 · Registrá la acción</h2><p style="margin:0 0 13px">${esc(skills[selectedSkill].name)} · <strong>${esc(pname(m,selectedPlayerId))}</strong> · zona ${selectedZone}</p><div class="outcome-grid">${skills[selectedSkill].outcomes.map(o=>{let c=/^(Ace|Punto|Perfecta|Positiva)$/.test(o)?'good':/^(Error|Bloqueado|Negativa)$/.test(o)?'bad':'neutral';return `<button class="outcome ${c}" data-action="add-actio function renderMatches(m){let list=[...state.matches].sort((a,b)=>b.createdAt.localeCompare(a.createdAt));return `<div class="row-between" style="margin-bottom:16px"><div><div class="eyebrow">Archivo local</div><h1 style="margin:0">Mis partidos</h1></div><button class="btn btn-primary" data-action="new-match">+ Crear partido</button></div><div class="card"><div class="history">${list.map(x=>{let w=matchWinner(x),curr=x.sets[x.sets.length-1];return `<div class="history-row ${x.id===m.id?'active':''}"><div><strong>${esc(x.team)} · ${esc(x.opponent)}</strong><br><small>${esc(x.date)} · ${x.sets.length} ${x.sets.length===1?'set':'sets'} · sets ${w.us}-${w.them}</small><div class="tags" style="margin-top:6px">${x.sets.map(s=>`<span class="tag">${s.score.us}-${s.score.them}</span>`).join('')}</div></div><div class="row"><button class="btn btn-small ${x.id===m.id?'btn-soft':''}" data-action="open-match" data-match="${esc(x.id)}">${x.id===m.id?'Abierto':'Abrir'}</button><button class="btn btn-small" data-action="download-match" data-match="${esc(x.id)}">↓ JSON</button><button class="btn btn-small btn-danger" data-action="delete-match" data-match="${esc(x.id)}">Eliminar</button></div></div>`}).join('')}</div></div><div class="card" style="margin-top:16px"><h2>Copias de seguridad</h2><p>Podés exportar todos tus partidos e importarlos en otro navegador o dispositivo. La importación reemplaza los datos locales actuales.</p><div class="row"><button class="btn btn-primary" data-action="backup">Descargar copia completa (.json)</button><label class="btn" for="backupInput" style="cursor:pointer">Restaurar una copia (.json)</label><input type="file" id="backupInput" accept="application/json,.json" style="display:none"></div></div>`}

function startMatch(){if(!validateDraftFormation())return;if(setupDraft.players.length<6){toast('Cargá al menos seis jugadores.');return}if(!setupDraft.team.trim()||!setupDraft.opponent.trim()){toast('Completá los nombres de los equipos.');return}let nums=setupDraft.players.map(x=>x.number.trim()), names=setupDraft.players.map(x=>x.name.trim());if(nums.some(x=>!x)||names.some(x=>!x)){toast('Todos los jugadores necesitan número y nombre.');return}if(new Set(nums).size!==nums.length){toast('Cada jugador debe tener un número distinto.');return}let players=setupDraft.players.map(x=>({id:x.id,name:x.name.trim(),number:x.number.trim(),isLibero:!!x.isLibero}));let m={id:uid(),createdAt:new Date().toISOString(),team:setupDraft.team.trim(),opponent:setupDraft.opponent.trim(),date:setupDraft.date||localDate(),bestOf:5,players,sets:[newSet(1,setupDraft.firstServe,[...setupDraft.lineup])]};if(setupDraft.opponentFormation?.some(p=>p.number?.trim()))setOpponentFormation(m.sets[0],setupDraft.opponentFormation);state.matches.push(m);state.activeId=m.id;showSetup=false;view='live';pending=[];selectedPlayerId=m.sets[0].positions[0];selectedSkill='attack';statSet='all';save();render();toast('¡Partido creado! Ya podés cargar acciones.');}
function finishRally(winner){let m=activeMatch(),s=activeSet();if(!s||s.finished)return;let r={id:uid(),timestamp:new Date().toISOString(),winner,serveBefore:s.serve,rotation:s.rotation,positions:[...s.positions],liberoBefore:s.libero?{...s.libero}:null,opponentBefore:s.opponentLineup?structuredCloneSafe(s.opponentLineup):null,changeCount:teamSet(s).changes.length,scoreBefore:{...s.score},actions:structuredCloneSafe(pending)};s.rallies.push(r);s.score[winner]++;if(s.opponentLineup&&s.serve==='us'&&winner==='them'){s.opponentLineup.current=rotatePositions(s.opponentLineup.current);s.opponentLineup.rotation=s.opponentLineup.rotation%6+1;}if(s.serve==='them'&&winner==='us'){s.positions=rotatePositions(s.positions);s.rotation=s.rotation%6+1;}s.serve=winner;let limit=getSetLimit(m,s);if(Math.max(s.score.us,s.score.them)>=limit&&Math.abs(s.score.us-s.score.them)>=2){s.finished=true;s.winner=s.score.us>s.score.them?'us':'them';}reconcileLibero(s);pending=[];save();render();if(s.finished)toast('Set finalizado. '+(matchEnded(m)?'¡Partido terminado!':'Iniciá el siguiente set cuando corresponda.'))}
function structuredCloneSafe(a){return JSON.parse(JSON.stringify(a))}
function undoRally(){let s=activeSet();if(!s?.rallies.length)return;if(pending.length&&!confirm('Hay acciones sin cerrar. ¿Querés reemplazarlas por las del último punto?'))return;let r=s.rallies.pop();if('opponentBefore' in r)s.opponentLineup=r.opponentBefore?structuredCloneSafe(r.opponentBefore):null;s.libero=r.liberoBefore?{...r.liberoBefore}:null;if(r.changeCount!=null)teamSet(s).changes.splice(r.changeCount);s.score={...r.scoreBefore};s.serve=r.serveBefore;s.rotation=r.rotation;s.positions=[...r.positions];s.finished=false;s.winner=null;pending=r.actions||[];save();render();toast('Punto deshecho; recuperamos sus acciones para corregirlas.')}
function nextSet(){let m=activeMatch(),s=activeSet();if(!s?.finished||matchEnded(m)||s.number>=5)return;let who=prompt('¿Quién saca primero en el set '+(s.number+1)+'? Escribí N para nosotros, o R para rival.','N');if(who==null)return;let serve=/^r/i.test(who.trim())?'them':'us';let upcoming=newSet(s.number+1,serve,s.positions);if(s.opponentLineup)setOpponentFormation(upcoming,s.opponentLineup.current);m.sets.push(upcoming);pending=[];selectedPlayerId=null;statSet='all';view='settings';save();render();toast('Set '+(s.number+1)+' iniciado. Revisá las posiciones en Plantel.');}
function safeFilename(x){return String(x).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9_-]+/g,'_').slice(0,65)}
function download(filename,content,mime){let blob=new Blob([content],{type:mime});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function csvCell(v){return '"'+String(v??'').replaceAll('"','""')+'"'}
function toCSV(rows){return '\ufeff'+rows.map(row=>row.map(csvCell).join(';')).join('\r\n')}
function exportActions(){let m=activeMatch(),rows=[['Fecha','Equipo','Rival','Set','Punto nuestro','Punto rival','Servicio previo','Rotacion','Ganador rally','Jugador numero','Jugador nombre','Fundamento','Resultado','Zona','Bloqueador rival número','Bloqueador rival nombre']];for(let s of m.sets)for(let r of s.rallies){let acts=r.actions.length?r.actions:[null];for(let a of acts){let p=a?playerById(m,a.playerId):null;rows.push([m.date,m.team,m.opponent,s.number,r.scoreBefore.us+(r.winner==='us'?1:0),r.scoreBefore.them+(r.winner==='them'?1:0),r.serveBefore==='us'?m.team:m.opponent,r.rotation,r.winner==='us'?m.team:m.opponent,p?.number||'',p?.name||'',a?skills[a.skill]?.name||a.skill:'',a?.outcome||'',a?.zone||'',a?.blocker?.number||'',a?.blocker?.name||''])}}download('acciones_'+safeFilename(m.team)+'_'+m.date+'.csv',toCSV(rows),'text/csv;charset=utf-8')}
function exportPlayerStats(){let m=activeMatch(),stats=getPlayerStats(m,statSet),rows=[['Equipo','Rival','Set filtro','Jugador','Numero','Acciones','Intentos ataque','Kills','Errores ataque','Eficacia ataque %','Saques','Aces','Errores saque','Recepciones','Recepciones positivas','Recepciones perfectas','Errores recepcion','Bloqueos punto','Defensas','Defensas positivas','Armados']];for(let x of stats)rows.push([m.team,m.opponent,statSet,x.p.name,x.p.number,x.total,x.attack,x.K,x.E,x.eff==null?'':x.eff.toFixed(1),x.serve,x.aces,x.serveErr,x.rec,x.recPos,x.recPerf,x.recErr,x.blk,x.def,x.defPos,x.setting]);download('estadisticas_'+safeFilename(m.team)+'_'+m.date+'.csv',toCSV(rows),'text/csv;charset=utf-8')}
function validBackup(x){return x&&x.version===1&&Array.isArray(x.matches)&&x.matches.every(m=>m&&typeof m.id==='string'&&Array.isArray(m.sets)&&Array.isArray(m.players)&&m.sets.every(s=>Array.isArray(s.rallies)&&Array.isArray(s.positions)&&s.positions.length===6))}
function perform(action,t){if(handleOpponentAction(action)||handleTeamAction(action))return;let m=activeMatch(),s=activeSet();switch(action){case 'new-match':setupDraft=freshSetup();showSetup=true;render();break;case 'cancel-setup':showSetup=false;render();break;case 'setup-add':setupDraft.players.push({number:String(setupDraft.players.length+1),name:'Jugador '+(setupDraft.players.length+1)});render();break;case 'setup-remove':if(setupDraft.players.length>6){setupDraft.players.splice(+t.dataset.index,1);render()}break;case 'create-match':startMatch();break;case 'view':view=t.dataset.view;pending=view==='live'?pending:pending;render();break;case 'select-player':selectedPlayerId=t.dataset.player;render();break;case 'select-skill':selectedSkill=t.dataset.skill;selectedZone=selectedSkill==='serve'?1:selectedSkill==='attack'?4:6;render();break;case 'select-zone':selectedZone=+t.dataset.zone;render();break;case 'add-action':if(s?.finished)return;pending.push({playerId:selectedPlayerId,skill:selectedSkill,outcome:t.dataset.outcome,zone:selectedZone});render();break;case 'remove-draft':pending.splice(+t.dataset.index,1);render();break;case 'remove-last-draft':pending.pop();render();break;case 'finish-rally':finishRally(t.dataset.winner);break;case 'undo-rally':undoRally();break;case 'next-set':nextSet();break;case 'open-match':state.activeId=t.dataset.match;pending=[];selectedPlayerId=null;statSet='all';view='live';save();render();break;case 'delete-match':{let other=state.matches.find(x=>x.id===t.dataset.match);if(!other||!confirm('¿Eliminar definitivamente el partido '+other.team+' vs '+other.opponent+'? Exportá una copia antes si querés conservarlo.'))return;state.matches=state.matches.filter(x=>x.id!==other.id);if(state.activeId===other.id)state.activeId=state.matches[0]?.id||null;pending=[];save();render();toast('Partido eliminado.');break}case 'download-match':{let x=state.matches.find(y=>y.id===t.dataset.match);if(x)download('partido_'+safeFilename(x.team)+'_'+x.date+'.json',JSON.stringify({version:1,match:x},null,2),'application/json');break}case 'download-actions':exportActions();break;case 'download-stats':exportPlayerStats();break;case 'download-formations':exportFormationStats();break;case 'download-direct-points':exportDirectPoints();break;case 'backup':download('respaldo_volley_scout_'+localDate()+'.json',JSON.stringify(state,null,2),'application/json');break;case 'print':{view='stats';render();window.print();break}case 'add-player':{let number=document.getElementById('addNumber')?.value.trim(),name=document.getElementById('addName')?.value.trim();if(!number||!name){toast('Cargá número y nombre.');return}if(m.players.some(p=>p.number===number)){toast('El número ya está usado.');return}m.players.push({id:uid(),number,name});save();render();toast('Jugador agregado.');break}default:break}}
document.addEventListener('click',e=>{let t=e.target.closest('[data-action]');if(t&&!t.disabled)perform(t.dataset.action,t)});
document.addEventListener('input',e=>{let t=e.target;if(t.matches('[data-setup]'))setupDraft[t.dataset.setup]=t.value;if(t.matches('[data-setup-roster]')){let p=setupDraft.players[+t.dataset.setupRoster];if(p)p[t.dataset.prop]=t.value;}});
document.addEventListener('change',e=>{let t=e.target,m=activeMatch(),s=activeSet();if(t.matches('[data-action="stat-set"]')){statSet=t.value;render();return}if(t.matches('[data-action="zone-skill"]')){zoneSkill=t.value;render();return}if(t.matches('[data-match-prop]')&&m){let prop=t.dataset.matchProp;m[prop]=t.value.trim()||m[prop];save();render();return}if(t.matches('[data-player-field]')&&m){let p=playerById(m,t.dataset.pid),v=t.value.trim();if(!p)return;if(!v){render();toast('No puede quedar vacío.');return}if(t.dataset.playerField==='number'&&m.players.some(x=>x.id!==p.id&&x.number===v)){render();toast('Ya hay un jugador con ese número.');return}p[t.dataset.playerField]=v;save();render();return}if(t.matches('[data-set-serve]')&&s){if(!betweenRallies(s)){render();return}s.serve=t.value;reconcileLibero(s);save();render();return}if(t.matches('[data-set-rotation]')&&s){if(!betweenRallies(s)){render();return}s.rotation=+t.value;save();render();return}if(t.id==='backupInput'){let file=t.files?.[0];if(!file)return;file.text().then(raw=>{let obj=JSON.parse(raw);if(obj.match){toast('Este JSON es de un solo partido. Importá una copia completa del archivo de Partidos.');return}if(!validBackup(obj)){toast('La copia JSON no tiene una estructura compatible.');return}if(!confirm('Importar va a REEMPLAZAR todos los partidos actuales de este navegador. ¿Continuar?'))return;state=obj;if(!state.matches.some(x=>x.id===state.activeId))state.activeId=state.matches[0]?.id||null;pending=[];view='matches';save();render();toast('Copia importada correctamente.');}).catch(()=>toast('No se pudo leer el archivo JSON.'))}});
render();
</script>
</body>
</html>
